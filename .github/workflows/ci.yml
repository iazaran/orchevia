name: CI

permissions:
  contents: read

# Keep PR workflows unfiltered so required checks always receive a conclusion.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed inputs
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      rust: ${{ steps.paths.outputs.rust }}
      desktop: ${{ steps.paths.outputs.desktop }}
      workflows: ${{ steps.paths.outputs.workflows }}
      macos: ${{ steps.paths.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: paths
        run: node scripts/ci-changes.mjs

  frontend:
    name: Frontend (format · lint · typecheck · tests · build)
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm format:check
      - run: pnpm test:delivery
      - name: Lint workflow changes
        if: needs.changes.outputs.workflows == 'true'
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Check public documentation
        run: pnpm exec vitest run src/test/public-docs.test.ts
      - if: needs.changes.outputs.frontend == 'true'
        run: pnpm lint
      - if: needs.changes.outputs.frontend == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.frontend == 'true'
        run: pnpm test
      - if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.desktop == 'true'
        run: pnpm build
      # This unprivileged CI-only artifact never enters the release workflow.
      - name: Share frontend for desktop compilation
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-frontend
          path: dist/
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust (fmt · clippy · tests)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: core-checks
          # PR writes stay in their merge-ref scope; main/tags cannot restore them.
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p orchevia-core --locked --all-targets -- -D warnings
      - run: cargo test -p orchevia-core --locked

  desktop:
    name: Desktop Linux (compile · tests)
    needs: [changes, frontend]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore frontend from this CI run only
        uses: actions/download-artifact@v8
        with:
          name: ci-frontend
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: desktop-checks
          # Save new dependencies for subsequent updates of the same PR too.
      - name: Install Linux deps
        run: bash scripts/install-linux-deps.sh
      # Tests compile every target with production default features, including dist/.
      # A preceding cargo check duplicates dependency compilation in another profile.
      - run: cargo test -p orchevia --locked --all-targets

  # Package Apple Silicon like the release and run its checks, so a change that
  # breaks the signed bundle fails here instead of on the tag.
  macos:
    name: Desktop macOS (package · signature · launch)
    needs: [changes]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --ci --bundles app,dmg --target aarch64-apple-darwin -- --locked
      - run: bash scripts/verify-macos-app.sh target/aarch64-apple-darwin/release/bundle --launch

  result:
    name: CI result
    needs: [changes, frontend, rust, desktop, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
          MACOS_CHANGED: ${{ needs.changes.outputs.macos }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$RUST_CHANGED" = true || test "$RUST_CHANGED" = false
          test "$DESKTOP_CHANGED" = true || test "$DESKTOP_CHANGED" = false
          test "$MACOS_CHANGED" = true || test "$MACOS_CHANGED" = false
          if [ "$RUST_CHANGED" = true ]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
          fi
          if [ "$DESKTOP_CHANGED" = true ]; then
            test "$DESKTOP_RESULT" = success
          else
            test "$DESKTOP_RESULT" = skipped
          fi
          if [ "$MACOS_CHANGED" = true ]; then
            test "$MACOS_RESULT" = success
          else
            test "$MACOS_RESULT" = skipped
          fi
