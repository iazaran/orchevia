name: CI

permissions:
  contents: read

# Keep PR workflows unfiltered so required checks always receive a conclusion.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed inputs
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      rust: ${{ steps.paths.outputs.rust }}
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: paths
        run: node scripts/ci-changes.mjs

  frontend:
    name: Frontend (format · lint · typecheck · tests · build)
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm format:check
      - run: pnpm test:delivery
      - name: Check public documentation
        run: pnpm exec vitest run src/test/public-docs.test.ts
      - if: needs.changes.outputs.frontend == 'true'
        run: pnpm lint
      - if: needs.changes.outputs.frontend == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.frontend == 'true'
        run: pnpm test
      - if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.desktop == 'true'
        run: pnpm build
      # This unprivileged CI-only artifact never enters the release workflow.
      - name: Share frontend for desktop compilation
        if: needs.changes.outputs.desktop == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-frontend
          path: dist/
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust (fmt · clippy · tests)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: core-checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p orchevia-core --locked --all-targets -- -D warnings
      - run: cargo test -p orchevia-core --locked

  desktop:
    name: Desktop Linux (check · tests)
    needs: [changes, frontend]
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore frontend from this CI run only
        uses: actions/download-artifact@v8
        with:
          name: ci-frontend
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: desktop-checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev patchelf libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - run: cargo check -p orchevia --locked
      - run: cargo test -p orchevia --locked

  result:
    name: CI result
    needs: [changes, frontend, rust, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          DESKTOP_CHANGED: ${{ needs.changes.outputs.desktop }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$RUST_CHANGED" = true || test "$RUST_CHANGED" = false
          test "$DESKTOP_CHANGED" = true || test "$DESKTOP_CHANGED" = false
          if [ "$RUST_CHANGED" = true ]; then
            test "$RUST_RESULT" = success
          else
            test "$RUST_RESULT" = skipped
          fi
          if [ "$DESKTOP_CHANGED" = true ]; then
            test "$DESKTOP_RESULT" = success
          else
            test "$DESKTOP_RESULT" = skipped
          fi
