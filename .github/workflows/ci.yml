name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (format · lint · typecheck · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust (fmt · clippy · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p orchevia-core --all-targets -- -D warnings
      # Full Tauri crate needs webview system libs: typecheck it on a runner
      # with deps (see `tauri-build` job); core tests run everywhere.
      - run: cargo test -p orchevia-core

  tauri-build:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev patchelf libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Test desktop commands
        if: runner.os == 'Linux'
        run: cargo test -p orchevia
      - name: Upload installer artifacts (PRs only, no public release)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: orchevia-installers-${{ matrix.os }}-pr${{ github.event.number }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Docs site validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docs/index.html exists and looks sane
        run: |
          test -f docs/index.html
          grep -qi "orchevia" docs/index.html
          python3 -c "import html.parser,sys; p=html.parser.HTMLParser(); p.feed(open('docs/index.html').read())"
          echo "docs OK"
