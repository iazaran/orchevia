name: Pages

# Only site changes start this workflow; Markdown-only docs edits validate but
# never redeploy (the job-level gate below), and CI checks the page on every PR.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/ci-changes.mjs'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/ci-changes.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs site
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.paths.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: paths
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/ci-changes.mjs
      - name: Validate docs/index.html
        run: |
          test -f docs/index.html
          grep -qi "orchevia" docs/index.html
          python3 - <<'PY'
          import html.parser
          import re
          from pathlib import Path
          content = Path('docs/index.html').read_text()
          html.parser.HTMLParser().feed(content)
          assert 'api.github.com' not in content
          assert '/releases/download/v' not in content
          for asset in ('Orchevia-macos-arm64.dmg', 'Orchevia-macos-x86_64.dmg',
                        'Orchevia-linux-x86_64.AppImage', 'Orchevia-linux-x86_64.deb',
                        'SHA256SUMS'):
              assert f'/releases/latest/download/{asset}' in content, asset
          for src in re.findall(r'src="\./([^"]+)"', content):
              assert (Path('docs') / src).is_file(), src
          print('docs OK')
          PY

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (needs.validate.outputs.site == 'true' || github.event_name == 'workflow_dispatch')
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
