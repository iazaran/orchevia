name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docs/index.html
        run: |
          test -f docs/index.html
          grep -qi "orchevia" docs/index.html
          python3 -c "import html.parser; p=html.parser.HTMLParser(); p.feed(open('docs/index.html').read())"
          echo "docs OK"

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    # PRs validate but never deploy over production.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
