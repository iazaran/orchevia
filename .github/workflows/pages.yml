name: Pages

# Only site changes start this workflow; Markdown-only docs edits validate but
# never redeploy (the job-level gate below), and CI checks the page on every PR.
# Each deployment also rebuilds the signed apt repository under /apt from the
# newest releases; the release workflow dispatches a run after publishing.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/ci-changes.mjs'
      - 'scripts/build-apt-repo.sh'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/ci-changes.mjs'
      - 'scripts/build-apt-repo.sh'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a main run: a later Markdown-only push would skip the deployment
# that the cancelled run owed.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate docs site
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.paths.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: paths
        if: github.event_name != 'workflow_dispatch'
        run: node scripts/ci-changes.mjs
      - name: Validate docs/index.html
        run: |
          test -f docs/index.html
          grep -qi "orchevia" docs/index.html
          python3 - <<'PY'
          import html.parser
          import re
          from pathlib import Path
          content = Path('docs/index.html').read_text()
          html.parser.HTMLParser().feed(content)
          assert 'api.github.com' not in content
          assert '/releases/download/v' not in content
          for asset in ('Orchevia-macos-arm64.dmg', 'Orchevia-macos-x86_64.dmg',
                        'Orchevia-linux-x86_64.AppImage', 'Orchevia-linux-x86_64.deb',
                        'SHA256SUMS'):
              assert f'/releases/latest/download/{asset}' in content, asset
          for src in re.findall(r'src="\./([^"]+)"', content):
              assert (Path('docs') / src).is_file(), src
          print('docs OK')
          PY
      # Same script as the deployment, signed with a throwaway key, then checked
      # the way apt checks it.
      - name: Build the apt repository with a throwaway key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          export GNUPGHOME="$RUNNER_TEMP/throwaway-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key "CI throwaway" ed25519 sign 1d
          APT_SIGNING_KEY=$(gpg --armor --export-secret-keys "CI throwaway") \
            scripts/build-apt-repo.sh "$RUNNER_TEMP/apt"
          gpgv --keyring "$RUNNER_TEMP/apt/orchevia-archive-keyring.gpg" \
            "$RUNNER_TEMP/apt/dists/stable/InRelease"
          grep -q '^Package: orchevia$' "$RUNNER_TEMP/apt/dists/stable/main/binary-amd64/Packages"

  deploy:
    name: Deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (needs.validate.outputs.site == 'true' || github.event_name == 'workflow_dispatch')
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      # A deployment replaces the whole site, so the apt repository is rebuilt
      # every time; without the signing key it fails rather than dropping /apt.
      - name: Assemble the site and the apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          mkdir -p _site
          cp -R docs/. _site/
          scripts/build-apt-repo.sh _site/apt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
