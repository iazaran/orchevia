name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Check tag and application versions
        run: pnpm version:check "$GITHUB_REF_NAME"
      # Restore main's dependency cache; a tag-scoped copy is never restored again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: core-checks
          save-if: false
      - run: pnpm test:delivery
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p orchevia-core --locked --all-targets -- -D warnings
      - run: cargo test -p orchevia-core --locked

  build:
    name: Build release (${{ matrix.os }} ${{ matrix.arch }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: ''
            bundles: deb,appimage
          # Both DMGs build on Apple Silicon: the Intel one is cross-compiled,
          # which is several times faster than an Intel runner. Each binary's
          # architecture is checked before staging, so keep the `app` bundle:
          # with `dmg` alone, Tauri deletes the .app after packaging.
          - os: macos-15
            arch: arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            arch: x86_64
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    # No dependency caches: a tag run can only restore caches saved by the same
    # tag or by main, so a release-scoped cache is never reused by the next tag.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps.sh
      - run: pnpm install --frozen-lockfile
      - name: Verify Linux runner architecture
        if: runner.os == 'Linux'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"
      # With the update signing secret, the bundler also writes signed update
      # bundles (the AppImage itself, a .app.tar.gz on macOS). Without it the
      # release ships installers only and copies keep offering the download.
      - name: Build and package (capture bundler stdout and stderr)
        id: package
        shell: bash
        env:
          RELEASE_BUNDLES: ${{ matrix.bundles }}
          RELEASE_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          updater=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # The bundler needs the public key too, and copies verify with it.
            if ! node -e 'process.exit(require("./src-tauri/tauri.conf.json").plugins?.updater?.pubkey?.trim() ? 0 : 1)'; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set, but src-tauri/tauri.conf.json has no plugins.updater.pubkey. Add the matching public key or remove the secret."
              exit 1
            fi
            updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm tauri build --ci --verbose --bundles "$RELEASE_BUNDLES" ${RELEASE_TARGET:+--target "$RELEASE_TARGET"} "${updater[@]}" -- --locked 2>&1 | tee build.log
      - name: macOS packaging diagnostics
        if: failure() && runner.os == 'macOS' && steps.package.outcome == 'failure'
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          df -h
          hdiutil info
          find "target/$RELEASE_TARGET/release/bundle" -maxdepth 3 -type f -print
      - name: Retain packaging failure evidence
        if: failure() && steps.package.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: packaging-diagnostics-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            build.log
            target/*/release/bundle/dmg/bundle_dmg.sh
          retention-days: 7
          if-no-files-found: error
      # v0.1.20 shipped an app only the linker had signed, which macOS reports as
      # "damaged" once downloaded. Refuse that, check the DMG holds the same
      # signed app, and launch it (Intel under Rosetta) before anything ships.
      - name: Verify the macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: bash scripts/verify-macos-app.sh "target/$RELEASE_TARGET/release/bundle" --launch
      # The Linux counterpart: start the app from the .deb (unpacked) and the
      # AppImage on a virtual display, each with an empty home folder, and
      # require it to open its database and keep running before anything ships.
      - name: Verify the Linux packages launch
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          command -v Xvfb >/dev/null || sudo apt-get install -y --no-install-recommends xvfb
          bash scripts/verify-linux-app.sh target/release/bundle
      - name: Stage artifacts
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          bundle=target/release/bundle
          if [ -n "$RELEASE_TARGET" ]; then
            bundle="target/$RELEASE_TARGET/release/bundle"
          fi
          mkdir -p release-artifacts
          if [ "$RUNNER_OS" = Linux ]; then
            deb=$(find "$bundle" -type f -name '*.deb' -print -quit)
            appimage=$(find "$bundle" -type f -name '*.AppImage' -print -quit)
            test -n "$deb"
            test -n "$appimage"
            cp "$deb" "release-artifacts/Orchevia-linux-$RELEASE_ARCH.deb"
            cp "$appimage" "release-artifacts/Orchevia-linux-$RELEASE_ARCH.AppImage"
            # The AppImage is its own update bundle; only its signature is extra.
            if [ -f "$appimage.sig" ]; then
              cp "$appimage.sig" "release-artifacts/Orchevia-linux-$RELEASE_ARCH.AppImage.sig"
            fi
          else
            app=$(find "$bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)
            test -n "$app"
            binaries=0
            while IFS= read -r -d '' binary; do
              archs=$(lipo -archs "$binary")
              echo "$binary: $archs"
              test "$archs" = "$RELEASE_ARCH"
              binaries=$((binaries + 1))
            done < <(find "$app/Contents/MacOS" -type f -perm -u+x -print0)
            test "$binaries" -gt 0
            dmg=$(find "$bundle/dmg" -type f -name '*.dmg' -print -quit)
            test -n "$dmg"
            cp "$dmg" "release-artifacts/Orchevia-macos-$RELEASE_ARCH.dmg"
            update=$(find "$bundle/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)
            if [ -n "$update" ]; then
              test -s "$update.sig"
              cp "$update" "release-artifacts/Orchevia-macos-$RELEASE_ARCH.app.tar.gz"
              cp "$update.sig" "release-artifacts/Orchevia-macos-$RELEASE_ARCH.app.tar.gz.sig"
            fi
          fi
          ls -la release-artifacts
      # Publication follows within minutes; one day is enough to rerun it and
      # keeps duplicate installers out of the account's Actions storage.
      - name: Upload release installers
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      # Retry only the upload once on transient network failures; never rebuild here.
      - name: Retry installer upload once
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
      actions: write
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No run-id/repository override: only artifacts built by this trusted tag run.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      # Four installers, plus the five signed update files when the signing
      # secret is set; never a partial set.
      - name: Checksums
        run: |
          cd release-artifacts
          for file in Orchevia-linux-x86_64.deb Orchevia-linux-x86_64.AppImage \
            Orchevia-macos-arm64.dmg Orchevia-macos-x86_64.dmg; do
            test -s "$file"
          done
          count=$(find . -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 4 ]; then
            test "$count" -eq 9
            for file in Orchevia-linux-x86_64.AppImage.sig \
              Orchevia-macos-arm64.app.tar.gz Orchevia-macos-arm64.app.tar.gz.sig \
              Orchevia-macos-x86_64.app.tar.gz Orchevia-macos-x86_64.app.tar.gz.sig; do
              test -s "$file"
            done
          fi
          find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.app.tar.gz' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS
      # Every signature must verify with the public key built into the app
      # before copies are told about the update.
      - name: In-place update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/updater-manifest.mjs release-artifacts "$RELEASE_TAG"
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
          body: |
            > Copies installed from the AppImage or a DMG can install this update from
            > Environment → Updates (0.1.24 and later). Debian and Ubuntu update through apt.
            >
            > macOS builds are not notarized yet, so macOS blocks the first launch with a
            > warning that it cannot verify Orchevia. Close the warning, then choose
            > **Open Anyway** in System Settings → Privacy & Security (System
            > Preferences → Security & Privacy on macOS 12 and earlier), or run
            > `xattr -dr com.apple.quarantine /Applications/Orchevia.app`.
      # The Pages workflow rebuilds the signed apt repository from the published
      # releases. Dispatching it on main keeps the github-pages environment rules
      # (main only) and works with the default token.
      - name: Refresh the apt repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
