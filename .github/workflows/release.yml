name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Check tag and application versions
        run: pnpm version:check "$GITHUB_REF_NAME"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p orchevia-core --all-targets -- -D warnings
      - run: cargo test -p orchevia-core

  build:
    name: Build release (${{ matrix.os }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev \
            librsvg2-dev patchelf libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Stage artifacts
        run: |
          mkdir -p release-artifacts
          if [ "$RUNNER_OS" = Linux ]; then
            deb=$(find target/release/bundle -type f -name '*.deb' -print -quit)
            appimage=$(find target/release/bundle -type f -name '*.AppImage' -print -quit)
            test -n "$deb" && test -n "$appimage"
            cp "$deb" release-artifacts/Orchevia-linux-x86_64.deb
            cp "$appimage" release-artifacts/Orchevia-linux-x86_64.AppImage
          else
            dmg=$(find target/release/bundle -type f -name '*.dmg' -print -quit)
            test -n "$dmg"
            cp "$dmg" "release-artifacts/Orchevia-macos-$(uname -m).dmg"
          fi
          ls -la release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release-artifacts/
          retention-days: 30

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-artifacts
      - name: Checksums
        run: |
          cd release-artifacts
          find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          body: |
            > macOS builds in early releases are **unsigned** (no notarization).
            > On first launch: right-click → Open, or run
            > `xattr -d com.apple.quarantine /Applications/Orchevia.app`.
