version: 2
# Monthly grouped updates keep CI runs (and private-repo Actions minutes) low;
# security updates are not limited by this schedule.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ['*']
    ignore:
      # typescript-eslint does not support the TypeScript 7 compiler API yet.
      - dependency-name: typescript
        versions: ['7.x']
    open-pull-requests-limit: 1
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ['*']
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
