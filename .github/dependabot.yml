version: 2
# Allow grouped patch PRs without moving paired npm/Cargo Tauri minor versions.
# Minor/major upgrades remain reviewed release work via `pnpm deps:update`.
# allow.update-types filters version updates only; security updates stay separate.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-type: all
        update-types: ['version-update:semver-patch']
    groups:
      frontend-patches:
        patterns: ['*']
    ignore:
      # typescript-eslint does not support the TypeScript 7 compiler API yet.
      - dependency-name: typescript
        versions: ['7.x']
    open-pull-requests-limit: 1
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-type: all
        update-types: ['version-update:semver-patch']
    groups:
      rust-patches:
        patterns: ['*']
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
