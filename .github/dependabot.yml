version: 2
# npm and Cargo are refreshed in every release PR with `pnpm deps:update`, so
# their version-update PRs are disabled (limit 0). Security updates are separate
# and unaffected. Workflow actions are pinned by major tag and change rarely.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint does not support the TypeScript 7 compiler API yet.
      - dependency-name: typescript
        versions: ['7.x']
    open-pull-requests-limit: 0
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
