name: Bug report
description: Report something broken in Orchevia
title: '[bug]: '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Orchevia version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / run output
      description: Paste per-node stdout/stderr from the Runs screen. Remove secrets first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed any secrets/tokens from the report
          required: true
