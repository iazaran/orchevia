[package]
name = "orchevia"
version = "0.1.14"
description = "Orchevia — local-first visual workflow orchestrator for developer AI agents and CLI tools."
authors = ["Orchevia Contributors"]
license = "Apache-2.0"
repository = "https://github.com/iazaran/orchevia"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = { version = "2.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
orchevia-core = { path = "../crates/core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
